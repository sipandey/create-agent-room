name: 'create-agent-room CI & Governance'
# GitHub Marketplace enforces a 125-character limit on this field (the
# Marketplace listing form rejects longer text) - keep it terse. The fuller
# explanation, including when to prefer the init --tools git-scaffolded
# workflow instead of this action, lives in docs/github-action.md and
# README.md's "GitHub Action" section.
description: "Validates agent-room guardrails, session logs, diff compliance, and reports PR scorecards in GitHub Actions."
author: 'Siddharth Pandey'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  target-dir:
    description: >-
      Directory containing the agent-room scaffold to check (must have a
      .agent-room/ directory). Relative to the job's working directory.
    required: false
    default: '.'
  base:
    description: >-
      Target base branch or ref (e.g. "main" or "origin/main") for PR diff,
      anti-tamper, rule-weakening, and session log presence checks.
    required: false
    default: ''
  strict:
    description: >-
      Treat warnings as failures and enforce strict test passing (exit code 1).
    required: false
    default: 'false'
  comment:
    description: >-
      Post or update a sticky PR compliance scorecard comment on the pull request.
      Requires pull-requests: write permission.
    required: false
    default: 'false'
  summary:
    description: >-
      Write interactive Markdown scorecard to GitHub Actions Job Summary ($GITHUB_STEP_SUMMARY).
    required: false
    default: 'true'
  github-token:
    description: >-
      GitHub token for posting PR comments. Defaults to env.GITHUB_TOKEN or github.token.
    required: false
    default: ''
  skip:
    description: >-
      Comma-separated list of check IDs to skip (e.g. "verify,eval").
    required: false
    default: ''
  only:
    description: >-
      Comma-separated list of check IDs to run exclusively (e.g. "validate,doctor").
    required: false
    default: ''
  checks:
    description: >-
      [Legacy] Which checks to run: "both", "validate", or "lint-sessions".
      Preserved for backward-compatibility. Prefer using "only" or "skip".
    required: false
    default: ''
  version:
    description: >-
      create-agent-room version to install and run, e.g. "2.5.0" or
      "latest". Pinned by default so CI results stay reproducible across
      runs instead of silently changing behavior when a new version ships —
      see the version-pinning rationale in
      templates/adapters/ci/github-actions.yml.tmpl for why. Bumped in
      lockstep with package.json's version at release time (see
      "Release process" in AGENTS.md/CLAUDE.md).
    required: false
    default: '2.5.0'
  node-version:
    description: 'Node.js version to set up before installing create-agent-room.'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Reject an unknown "checks" input
      if: inputs.checks != '' && inputs.checks != 'both' && inputs.checks != 'validate' && inputs.checks != 'lint-sessions' && inputs.checks != 'ci'
      shell: bash
      run: |
        echo "::error::Invalid 'checks' input: '${{ inputs.checks }}'. Must be 'both', 'validate', 'lint-sessions', or 'ci'."
        exit 1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Installed explicitly (npm install -g) rather than run via
    # `npx --yes pkg@version cmd` - npx's temporary-install/exec-resolution
    # path was found to fail intermittently on GitHub-hosted runners
    # ("sh: 1: create-agent-room: not found", even though the package
    # installed correctly). A global install + direct invocation sidesteps
    # that machinery entirely. See .agent-room/anti-patterns.md, 2026-07-14.
    - name: Install create-agent-room
      shell: bash
      run: npm install -g "create-agent-room@${{ inputs.version }}"

    - name: Run create-agent-room CI
      shell: bash
      run: |
        ARGS=()

        if [ -n "${{ inputs.base }}" ]; then
          ARGS+=(--base "${{ inputs.base }}")
        fi

        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS+=(--strict)
        fi

        if [ "${{ inputs.comment }}" = "true" ]; then
          ARGS+=(--comment)
        fi

        if [ "${{ inputs.summary }}" = "true" ]; then
          ARGS+=(--summary)
        fi

        if [ -n "${{ inputs.github-token }}" ]; then
          ARGS+=(--github-token "${{ inputs.github-token }}")
        fi

        SKIP="${{ inputs.skip }}"
        ONLY="${{ inputs.only }}"

        if [ -z "$ONLY" ]; then
          if [ "${{ inputs.checks }}" = "validate" ]; then
            ONLY="validate"
          elif [ "${{ inputs.checks }}" = "lint-sessions" ]; then
            ONLY="sessions"
          elif [ "${{ inputs.checks }}" = "both" ]; then
            ONLY="validate,sessions"
          fi
        fi

        if [ -n "$SKIP" ]; then
          ARGS+=(--skip "$SKIP")
        fi

        if [ -n "$ONLY" ]; then
          ARGS+=(--only "$ONLY")
        fi

        create-agent-room ci "${{ inputs.target-dir }}" "${ARGS[@]}"
